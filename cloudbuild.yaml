# Cloud Build → Artifact Registry / GCR image for Cloud Run
# Usage:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_IMAGE=gcr.io/254040893134/fab-clean-api:$SHORT_SHA
substitutions:
  _IMAGE: gcr.io/254040893134/fab-clean-api:latest

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Backend/Dockerfile
      - -t
      - ${_IMAGE}
      - .

images:
  - ${_IMAGE}

timeout: 1200s
