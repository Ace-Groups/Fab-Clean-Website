<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0c6356" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#04322a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#021a15" stop-opacity="1"/>
    </radialGradient>
    
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="goldFoil" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="emeraldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#043e34"/>
      <stop offset="50%" stop-color="#022821"/>
      <stop offset="100%" stop-color="#011814"/>
    </linearGradient>

    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="800" fill="url(#bgGlow)"/>

  <!-- Subtle Festive Sparkles in Background -->
  <g opacity="0.25">
    <circle cx="150" cy="180" r="3" fill="#fde047"/>
    <circle cx="280" cy="90" r="2" fill="#fde047"/>
    <circle cx="1020" cy="160" r="3.5" fill="#fde047"/>
    <circle cx="940" cy="240" r="2.5" fill="#fde047"/>
    <circle cx="1120" cy="380" r="2" fill="#fde047"/>
    <circle cx="90" cy="460" r="3" fill="#fde047"/>
    <circle cx="1080" cy="580" r="3" fill="#fde047"/>
  </g>

  <!-- Top Logo & Tagline -->
  <g transform="translate(100, 60)">
    <!-- Fab Clean Stylized Branding -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#22c55e" letter-spacing="1">
      fab<tspan fill="#f97316">clean</tspan>
    </text>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" letter-spacing="3">
      DRY CLEAN | LAUNDRY
    </text>
  </g>

  <!-- Right Script Callout -->
  <g transform="translate(850, 75)">
    <text x="0" y="0" font-family="Georgia, serif" font-style="italic" font-size="28" fill="#fef08a" text-anchor="middle">
      Share the Freshness...
    </text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1" text-anchor="middle">
      Invite friends &amp; family for premium garment care!
    </text>
  </g>

  <!-- CENTER ORNATE MEDALLION CREST -->
  <g transform="translate(600, 390)">
    <!-- Outer Scalloped Baroque Crest Path -->
    <path d="M 0 -240 
             C 45 -240 75 -225 105 -225 
             C 150 -225 185 -240 225 -215 
             C 260 -190 260 -150 280 -120 
             C 300 -85 330 -60 330 0 
             C 330 60 300 85 280 120 
             C 260 150 260 190 225 215 
             C 185 240 150 225 105 225 
             C 75 225 45 240 0 240 
             C -45 240 -75 225 -105 225 
             C -150 225 -185 240 -225 215 
             C -260 190 -260 150 -280 120 
             C -300 85 -330 60 -330 0 
             C -330 -60 -300 -85 -280 -120 
             C -260 -150 -260 -190 -225 -215 
             C -185 -240 -150 -225 -105 -225 
             C -75 -225 -45 -240 0 -240 Z" 
          fill="url(#emeraldInner)" 
          stroke="url(#goldLinear)" 
          stroke-width="5" 
          filter="url(#goldShadow)"/>

    <!-- Inner Filigree Border -->
    <path d="M 0 -225 
             C 40 -225 65 -212 95 -212 
             C 135 -212 165 -225 205 -202 
             C 238 -180 238 -142 258 -112 
             C 278 -80 305 -55 305 0 
             C 305 55 278 80 258 112 
             C 238 142 238 180 205 202 
             C 165 225 135 212 95 212 
             C 65 212 40 225 0 225 
             C -40 225 -65 212 -95 212 
             C -135 212 -165 225 -205 202 
             C -238 180 -238 142 -258 112 
             C -278 80 -305 55 -305 0 
             C -305 -55 -278 -80 -258 -112 
             C -238 -142 -238 -180 -205 -202 
             C -165 -225 -135 -212 -95 -212 
             C -65 -212 -40 -225 0 -225 Z" 
          fill="none" 
          stroke="url(#goldFoil)" 
          stroke-width="1.75" 
          stroke-dasharray="8 4"/>

    <!-- Top Apex Diya / Sacred Flame -->
    <g transform="translate(0, -240)">
      <circle cx="0" cy="0" r="22" fill="#021c17" stroke="url(#goldLinear)" stroke-width="3"/>
      <!-- Flame Icon -->
      <path d="M 0 -12 C 4 -6 7 -2 7 4 C 7 8 3 12 0 12 C -3 12 -7 8 -7 4 C -7 -2 -4 -6 0 -12 Z" fill="#fbbf24"/>
      <path d="M 0 -7 C 2 -3 4 0 4 3 C 4 6 2 8 0 8 C -2 8 -4 6 -4 3 C -4 0 -2 -3 0 -7 Z" fill="#fef08a"/>
    </g>

    <!-- Top Ribbon: REFERRAL SPECIAL -->
    <g transform="translate(0, -180)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#b45309" stroke="url(#goldLinear)" stroke-width="1.5"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="2.5" text-anchor="middle">
        50/50 REFER &amp; EARN SPECIAL
      </text>
    </g>

    <!-- 3D Gold 50/50 Typography -->
    <text x="0" y="-25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="110" font-weight="900" fill="url(#goldLinear)" letter-spacing="2" text-anchor="middle" filter="url(#goldShadow)">
      50/50
    </text>

    <!-- Sub-heading Pill: GIVE ₹50, GET ₹50 -->
    <g transform="translate(0, 30)">
      <rect x="-165" y="-17" width="330" height="34" rx="17" fill="rgba(245, 158, 11, 0.18)" stroke="url(#goldLinear)" stroke-width="2"/>
      <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" letter-spacing="2" text-anchor="middle">
        GIVE ₹50 · GET ₹50
      </text>
    </g>

    <!-- Scope Subtitle -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#e2e8f0" letter-spacing="1.5" text-anchor="middle">
      ON ALL DRY CLEANING &amp; PREMIUM LAUNDRY SERVICES
    </text>

    <!-- 5 Service Icon Circular Badges Row -->
    <g transform="translate(0, 145)">
      <!-- Badge 1: Shirts & Trousers -->
      <g transform="translate(-160, 0)">
        <circle cx="0" cy="0" r="22" fill="#032720" stroke="url(#goldLinear)" stroke-width="1.5"/>
        <text x="0" y="5" font-size="16" text-anchor="middle">👔</text>
        <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#f8fafc" text-anchor="middle">Shirts &amp; Pants</text>
      </g>

      <!-- Badge 2: Suits & Blazers -->
      <g transform="translate(-80, 0)">
        <circle cx="0" cy="0" r="22" fill="#032720" stroke="url(#goldLinear)" stroke-width="1.5"/>
        <text x="0" y="5" font-size="16" text-anchor="middle">🧥</text>
        <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#f8fafc" text-anchor="middle">Suits &amp; Blazers</text>
      </g>

      <!-- Badge 3: Sarees & Silk -->
      <g transform="translate(0, 0)">
        <circle cx="0" cy="0" r="22" fill="#032720" stroke="url(#goldLinear)" stroke-width="1.5"/>
        <text x="0" y="5" font-size="16" text-anchor="middle">✨</text>
        <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#f8fafc" text-anchor="middle">Sarees &amp; Silk</text>
      </g>

      <!-- Badge 4: Lehengas & Ethnic -->
      <g transform="translate(80, 0)">
        <circle cx="0" cy="0" r="22" fill="#032720" stroke="url(#goldLinear)" stroke-width="1.5"/>
        <text x="0" y="5" font-size="16" text-anchor="middle">👗</text>
        <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#f8fafc" text-anchor="middle">Lehengas</text>
      </g>

      <!-- Badge 5: Delicate Care -->
      <g transform="translate(160, 0)">
        <circle cx="0" cy="0" r="22" fill="#032720" stroke="url(#goldLinear)" stroke-width="1.5"/>
        <text x="0" y="5" font-size="16" text-anchor="middle">🧵</text>
        <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#f8fafc" text-anchor="middle">Delicates</text>
      </g>
    </g>
  </g>

  <!-- Left Promotional Callout Card: How to Refer -->
  <g transform="translate(140, 520)">
    <rect x="-100" y="-55" width="200" height="110" rx="14" fill="rgba(4, 47, 40, 0.85)" stroke="url(#goldLinear)" stroke-width="1.5"/>
    <text x="0" y="-30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#fef08a" letter-spacing="1" text-anchor="middle">
      STEP 1: INVITE
    </text>
    <text x="0" y="-8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">
      Share Your Code
    </text>
    <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">
      Send via WhatsApp
    </text>
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">
      Friend gets ₹25 - ₹50
    </text>
  </g>

  <!-- Right Promotional Callout Card: Wallet Reward -->
  <g transform="translate(1060, 520)">
    <rect x="-100" y="-55" width="200" height="110" rx="14" fill="rgba(4, 47, 40, 0.85)" stroke="url(#goldLinear)" stroke-width="1.5"/>
    <text x="0" y="-30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#fef08a" letter-spacing="1" text-anchor="middle">
      STEP 2: YOU EARN
    </text>
    <text x="0" y="-8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">
      ₹50 in Your Wallet
    </text>
    <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">
      When 1st order is placed
    </text>
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">
      Instant Auto-Credit!
    </text>
  </g>

  <!-- BOTTOM BRAND FOOTER STRIP -->
  <g transform="translate(0, 715)">
    <!-- Footer Dark Band -->
    <rect width="1200" height="85" fill="#011410"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#goldLinear)" stroke-width="2"/>

    <!-- Hotlines on Left -->
    <g transform="translate(120, 48)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#fef08a" letter-spacing="0.5">
        📞 93630 59595  |  98867 88858
      </text>
      <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">
        Pollachi &amp; Suleeshwaranpatti Facilities
      </text>
    </g>

    <!-- Center Quality Value Badges -->
    <g transform="translate(600, 48)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" text-anchor="middle" letter-spacing="1">
        🌿 Eco-Friendly Cleaning  •  🚚 Free Doorstep Pickup  •  💳 Digital Wallet Cashback
      </text>
      <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">
        Valid on first doorstep booking. T&amp;C apply.
      </text>
    </g>

    <!-- Domain on Right -->
    <g transform="translate(1080, 48)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#34d399" text-anchor="end">
        app.myfabclean.com
      </text>
      <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="end">
        FRESH CLOTHES. HAPPY YOU.
      </text>
    </g>
  </g>
</svg>
